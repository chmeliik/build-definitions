apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: mixed-units-mi-vs-gi
spec:
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        # Expected: bump request to 6144Mi, keep limit at 12288Mi,
        # remove sbom stepSpec
        # (req: 6144Mi > 4Gi → bump; limit: 10Gi < 12288Mi → keep)
        - name: build
          computeResources:
            requests:
              memory: 4Gi
            limits:
              memory: 12288Mi
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 6144Mi
            limits:
              memory: 10Gi
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
