apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: all-remote-no-build-override
spec:
  params:
    - name: build-platforms
      value:
        - linux/arm64
        - linux/s390x
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        # Expected: remove sbom stepSpec, no build inserted,
        # then remove taskRunSpec entirely (all remote, skip bump,
        # only pipelineTaskName remains)
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 10Gi
            limits:
              memory: 10Gi
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
