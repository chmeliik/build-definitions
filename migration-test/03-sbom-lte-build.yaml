apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: sbom-lte-build
spec:
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        - name: build
          computeResources:
            requests:
              memory: 12Gi
            limits:
              memory: 12Gi
        # Expected: remove this stepSpec, keep build as is
        # (sbom 10Gi < build 12Gi, no resource bump needed)
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 10Gi
            limits:
              memory: 10Gi
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
