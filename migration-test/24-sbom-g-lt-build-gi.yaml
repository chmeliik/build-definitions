apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: sbom-g-lt-build-gi
spec:
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        - name: build
          computeResources:
            requests:
              memory: 4.8Gi
            limits:
              memory: 4.8Gi
        # Expected: remove this stepSpec, keep build as is
        # (5G = 5000000000 < 4.8Gi = 5153960755,
        #  decimal G < binary Gi despite the larger number)
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 5G
            limits:
              memory: 5G
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
