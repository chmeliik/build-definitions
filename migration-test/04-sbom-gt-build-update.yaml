apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: sbom-gt-build-update
spec:
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        # Expected: update build to req 10Gi / limit 12Gi,
        # remove sbom-syft-generate stepSpec
        - name: build
          computeResources:
            requests:
              memory: 6Gi
            limits:
              memory: 6Gi
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 10Gi
            limits:
              memory: 12Gi
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
