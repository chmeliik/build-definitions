apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-platforms-linux-x86
spec:
  params:
    - name: build-platforms
      value:
        - linux/x86_64
        - linux/arm64
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        # Expected: normal processing (linux/x86_64 builds in cluster),
        # bump build to 10Gi, remove sbom stepSpec
        - name: build
          computeResources:
            requests:
              memory: 4Gi
            limits:
              memory: 4Gi
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 10Gi
            limits:
              memory: 10Gi
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
