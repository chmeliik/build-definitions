apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: only-limit-bumped
spec:
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        # Expected: bump build limit to 10Gi, keep request at 10Gi,
        # remove sbom-syft-generate stepSpec
        # (sbom limit 10Gi > build limit 6Gi, but
        #  build req 10Gi > sbom req 8Gi)
        - name: build
          computeResources:
            requests:
              memory: 10Gi
            limits:
              memory: 6Gi
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 8Gi
            limits:
              memory: 10Gi
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
