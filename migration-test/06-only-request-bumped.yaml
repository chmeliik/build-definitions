apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: only-request-bumped
spec:
  taskRunSpecs:
    - pipelineTaskName: build-container
      stepSpecs:
        # Expected: bump build request to 10Gi, keep limit at 16Gi,
        # remove sbom-syft-generate stepSpec
        # (sbom req 10Gi > build req 6Gi, but
        #  build limit 16Gi > sbom limit 10Gi)
        - name: build
          computeResources:
            requests:
              memory: 6Gi
            limits:
              memory: 16Gi
        - name: sbom-syft-generate
          computeResources:
            requests:
              memory: 10Gi
            limits:
              memory: 10Gi
  pipelineSpec:
    tasks:
      - name: build-container
        taskRef:
          resolver: bundles
          params:
            - name: kind
              value: task
            - name: name
              value: buildah
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.2
